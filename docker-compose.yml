# 로컬에서 백엔드 + 프론트엔드를 한 번에 실행.
#   docker compose up --build
# 프론트: http://localhost:5173 · 백엔드: http://localhost:8080
# 시세와 원화 환산은 인증키 없이 동작한다.
services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - backend
