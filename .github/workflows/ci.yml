name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  infra:
    name: 인프라 스크립트 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n infra/*.sh
      - run: bash infra/health-recovery.test.sh
      - run: bash infra/run-api-container.test.sh

  backend:
    name: 백엔드 빌드·테스트
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew build
      - run: python3 ../loadtest/run_resilience_test.py

  frontend:
    name: 프론트엔드 빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
