# 로컬에서 백엔드 + 프론트엔드를 한 번에 실행.
#   docker compose up --build
# 프론트: http://localhost:5173 · 백엔드: http://localhost:8080
# 공공데이터 키는 선택(없으면 확정 종가만 미표시). 환율(Pyth)은 키가 필요 없다:
#   PUBLIC_DATA_SERVICE_KEY=... docker compose up --build
services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      PUBLIC_DATA_SERVICE_KEY: ${PUBLIC_DATA_SERVICE_KEY:-}

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - backend
