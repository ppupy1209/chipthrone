services:
  fake-quotes:
    image: python:3.13-alpine
    working_dir: /app
    command: ["python", "fake_quote_server.py"]
    environment:
      FAKE_QUOTE_HOST: 0.0.0.0
    volumes:
      - ./loadtest/fake_quote_server.py:/app/fake_quote_server.py:ro

  backend:
    environment:
      SPRING_PROFILES_ACTIVE: loadtest
      CHIPTHRONE_LOADTEST_MARKET_MODE: ${CAPTURE_MARKET_MODE:-REGULAR}
      CHIPTHRONE_LOADTEST_US_MARKET_OPEN: ${CAPTURE_US_MARKET_OPEN:-true}
      CHIPTHRONE_SOURCE_HYPERLIQUID_URL: http://fake-quotes:19090/info
      CHIPTHRONE_SOURCE_FX_URL: http://fake-quotes:19090/fx
      KIS_BASE_URL: http://fake-quotes:19090
      KIS_APP_KEY: fake-capture-key
      KIS_APP_SECRET: fake-capture-secret
      ALPACA_SNAPSHOTS_URL: http://fake-quotes:19090/v2/stocks/snapshots
      ALPACA_API_KEY: fake-capture-key
      ALPACA_API_SECRET: fake-capture-secret
    depends_on:
      - fake-quotes

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
