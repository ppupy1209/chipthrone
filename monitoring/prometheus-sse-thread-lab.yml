global:
  scrape_interval: 1s

scrape_configs:
  - job_name: chipthrone-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:18080"]

  - job_name: sse-load-generator
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:19100"]
