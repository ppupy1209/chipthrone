spring:
  application:
    name: chipthrone-api

logging:
  logback:
    rollingpolicy:
      max-file-size: 10MB
      total-size-cap: 20MB
      max-history: 7

server:
  port: 8080

chipthrone:
  alert:
    slack-webhook-url: ${SLACK_WEBHOOK_URL:}
    consecutive-failure-threshold: 5
    cooldown-minutes: 10
  source:
    public-data-service-key: ${PUBLIC_DATA_SERVICE_KEY:}
    # 인증키 없는 공개 시세를 서버 내부 원화 환산에만 사용한다.
    upbit-api-url: ${UPBIT_API_URL:https://api.upbit.com}
    upbit-market: ${UPBIT_MARKET:KRW-USDC}
  quote:
    polling-enabled: true
    dex: xyz
    assets:
      # 금융위원회 일별 데이터의 상장주식수로 갱신됨. 값은 API 미연동 시 폴백.
      - code: "005930"
        name: "삼성전자"
        symbol: "xyz:SMSN"
        shares-outstanding: 5919637922
        market: KRX
      # 금융위원회 일별 데이터의 상장주식수로 갱신됨. 값은 API 미연동 시 폴백.
      - code: "000660"
        name: "SK하이닉스"
        symbol: "xyz:SKHX"
        shares-outstanding: 728002365
        market: KRX
      # SEC 2026-04-24 발행주식수
