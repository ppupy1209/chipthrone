name: EC2 Read-only Inspect

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Existing EC2 resource snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
    steps:
      - name: Configure SSH
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/chipthrone-ec2"
          chmod 600 "$HOME/.ssh/chipthrone-ec2"
          timeout 15 ssh-keyscan -H "$EC2_HOST" > "$HOME/.ssh/known_hosts"

      - name: Read host and container state
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=10 \
            -i "$HOME/.ssh/chipthrone-ec2" "$EC2_USER@$EC2_HOST" '
              set -eu
              echo "== CPU =="
              nproc
              uptime
              echo "== MEMORY =="
              free -m
              echo "== CONTAINERS =="
              sudo docker inspect --format \
                "{{.Config.Image}} {{.Image}} {{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{end}} memory_limit={{.HostConfig.Memory}}" \
                chipthrone-api
              sudo docker stats --no-stream --format \
                "{{.Name}} cpu={{.CPUPerc}} memory={{.MemUsage}} pids={{.PIDs}}" \
                chipthrone-api watchtower
              echo "== HEALTH =="
              curl -fsS http://127.0.0.1:8080/api/health
              echo
              systemctl is-active chipthrone-health-recovery.timer || true
            '

      - name: Remove SSH key
        if: always()
        run: rm -f "$HOME/.ssh/chipthrone-ec2"
